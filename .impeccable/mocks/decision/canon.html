<!doctype html><html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#F8FAFC;font-family:"Noto Sans Thai",sans-serif;color:#0F172A;line-height:1.6}
header{height:64px;background:#fff;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;padding:0 40px;gap:24px}
header b{color:#2563EB;font-size:20px}
header nav{margin-left:auto;display:flex;gap:20px;color:#475569;font-size:15px}
main{max-width:1200px;margin:0 auto;padding:32px 0;display:grid;gap:24px}
.search{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:24px;display:grid;gap:12px}
.search h1{font-size:28px}
form{display:flex;gap:8px}
input{flex:1;height:50px;border:1px solid #CBD5E1;border-radius:10px;padding:0 16px;font:inherit}
button{height:50px;padding:0 22px;border:0;border-radius:10px;background:#2563EB;color:#fff;font:600 16px inherit}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:20px;display:grid;gap:8px}
.card b{font-size:34px}
.bar{height:8px;border-radius:4px;background:#E2E8F0;overflow:hidden}.bar i{display:block;height:100%}
.map{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:20px;display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.map i{height:46px;border-radius:6px;background:#E2E8F0}.map i.f{background:#DCFCE7;border:1px solid #86EFAC}
</style></head><body>
<header><b>Easy Parking</b><span style="color:#64748B">อีซี่ มอลล์ พระราม 9</span><nav><span>ช่องว่าง</span><span>ชำระค่าจอด</span><span>จองล่วงหน้า</span><span>ประวัติ</span></nav></header>
<main>
<div class="search"><h1>ค้นหารถของคุณ</h1><form><input placeholder="กรอกทะเบียน เช่น กข 1234"><button>ค้นหา / ชำระเงิน</button></form></div>
<div class="cards">
<div class="card"><span>ชั้น 1</span><b>11 <small style="font-size:16px;color:#64748B">/ 24</small></b><div class="bar"><i style="width:46%;background:#16A34A"></i></div></div>
<div class="card"><span>ชั้น B1</span><b>16 <small style="font-size:16px;color:#64748B">/ 40</small></b><div class="bar"><i style="width:40%;background:#16A34A"></i></div></div>
<div class="card"><span>ชั้น B2</span><b>3 <small style="font-size:16px;color:#64748B">/ 36</small></b><div class="bar"><i style="width:8%;background:#DC2626"></i></div></div>
</div>
<div class="map"><i></i><i class="f"></i><i></i><i></i><i class="f"></i><i></i><i></i><i class="f"></i><i></i><i></i><i class="f"></i><i></i><i class="f"></i><i></i><i></i><i class="f"></i><i></i><i class="f"></i><i></i><i></i><i class="f"></i><i></i><i></i><i class="f"></i><i></i><i class="f"></i><i></i><i></i><i class="f"></i><i></i><i></i><i></i><i class="f"></i><i></i><i></i><i class="f"></i></div>
</main></body></html>
